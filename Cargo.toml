[package]
name = "rmcp"
version = "0.2.3"
edition = "2024"

[dependencies]
colored = "2"
spinoff = "0.8.0"
termimad = "0.20"
ollama-rs = { version = "0.3.4", features = ["stream"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = { version = "1", features = [ "derive" ] }
strum = { version = "0.26", features = ["derive"] }
